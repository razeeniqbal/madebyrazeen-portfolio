# Pulls recent Garmin runs into content/running/runs.json and commits the change,
# which triggers a normal Vercel redeploy. The site itself never calls Garmin.
#
# Setup (repo → Settings → Secrets and variables → Actions):
#   GARMIN_EMAIL, GARMIN_PASSWORD
# If your Garmin account uses MFA, run the script locally once with GARMINTOKENS set,
# then store the token files instead (see scripts/garmin/README.md).

name: Garmin sync

on:
  schedule:
    - cron: '0 22 * * *' # 06:00 Malaysia time
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r scripts/garmin/requirements.txt
      - run: python scripts/garmin/export_runs.py
        env:
          GARMIN_EMAIL: ${{ secrets.GARMIN_EMAIL }}
          GARMIN_PASSWORD: ${{ secrets.GARMIN_PASSWORD }}
      - name: Commit if changed
        run: |
          if git diff --quiet -- content/running/runs.json; then
            echo "No new runs."
          else
            git config user.name "garmin-sync"
            git config user.email "actions@users.noreply.github.com"
            git add content/running/runs.json content/running/meta.json
            git commit -m "chore(running): sync Garmin runs"
            git push
          fi
